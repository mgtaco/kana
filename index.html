<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kana — Learn Hiragana</title>
    <meta
      name="description"
      content="Learn the Japanese hiragana writing system: guided lessons with a hook for every character, a complete chart, and drills for characters, words and speed."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS does not support SVG here and silently falls back to a screenshot
         of the page, so the touch icon has to be a PNG. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Deprecated, kept for iOS versions that only know the prefixed name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kana" />
    <!-- `default` rather than `black-translucent`: it lets iOS tint the status
         bar from the theme-color metas below, so it follows light and dark by
         itself. `black-translucent` would put white text on a cream page. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint so there is no flash of the wrong palette.
      (function () {
        try {
          var pref = localStorage.getItem('kana:theme');
          if (pref === 'light' || pref === 'dark') {
            document.documentElement.dataset.theme = pref;
          }
        } catch (_) {
          /* storage unavailable (private mode, disabled cookies) — fall back to system theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">
        Kana needs JavaScript enabled to run the hiragana chart and quizzes.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
